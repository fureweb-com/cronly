name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Verify real systemd user timers
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo systemctl start "user@$(id -u).service"
          npm run test:systemd

      - name: Verify real launchd jobs
        if: runner.os == 'macOS'
        run: npm run test:launchd

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Set up the minimum supported Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@v6
        with:
          node-version: '14.8.0'

      - name: Verify real user timers on Node.js 14.8.0
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          node test/systemd-integration.mjs

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify real Windows scheduled tasks
        run: npm run test:windows
